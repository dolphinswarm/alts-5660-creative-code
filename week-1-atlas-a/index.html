<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Week 1 - Atlas A</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../style.css" />
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
				}
			}
		</script>
		<script src="../shared/back-button.js" defer></script>
	</head>
	<body class="quantico-regular">
		<section class="content">
			<back-button href="../index.html"></back-button>

			<header>
				<h1>Week 1: ATLAS A</h1>
				<p>
					Made using Three.JS. Contains 4 separate scenes, each with a
					differently-stylized A, which can be explored in 3D space
					using mouse controls.
				</p>
			</header>

			<main>
				<img
					id="static"
					src="assets/static.gif"
					alt=""
					aria-hidden="true"
				/>
			</main>

			<aside class="controls">
				<button id="prev-scene">←</button>
				<button id="next-scene">→</button>
			</aside>
		</section>

		<script type="module" src="ATLAS-A.js"></script>
	</body>
</html>
